name: ParaBank Playwright CI
run-name: 'ParaBank CI — ${{ github.ref_name }} by @${{ github.actor }}'

on:
  push:
    branches: ['**'] # Trigger on every commit to every branch
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

  test:
    name: Run UI + API Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests (UI + API)
        id: playwright
        run: npm test
        env:
          CI: true
        continue-on-error: true # allow post-steps to run even on failure

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # ── Parse results.json and set outputs for the email step ──────────────

      - name: Parse test results for email
        id: parse
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const resultsPath = 'playwright-report/results.json';
          if (!fs.existsSync(resultsPath)) {
            console.log('No results file found.');
            process.exit(0);
          }

          const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
          const suites = results.suites || [];

          let total = 0, passed = 0, failed = 0, skipped = 0, flaky = 0;
          const failedTests = [];
          const flakyTests = [];

          function walk(suite) {
            for (const spec of (suite.specs || [])) {
              for (const test of (spec.tests || [])) {
                total++;
                const status = test.status;
                if (status === 'expected') passed++;
                else if (status === 'unexpected') {
                  failed++;
                  failedTests.push({
                    title: spec.title,
                    file: spec.file,
                    retries: test.results?.length - 1 || 0,
                  });
                }
                else if (status === 'skipped') skipped++;
                else if (status === 'flaky') {
                  flaky++;
                  flakyTests.push(spec.title);
                }
              }
            }
            for (const child of (suite.suites || [])) walk(child);
          }

          for (const suite of suites) walk(suite);

          const summary = {total, passed, failed, skipped, flaky, failedTests, flakyTests};
          fs.writeFileSync('test-summary.json', JSON.stringify(summary, null, 2));

          // Write to GitHub output
          const outputFile = process.env.GITHUB_OUTPUT;
          const lines = [
            'total=' + total,
            'passed=' + passed,
            'failed=' + failed,
            'skipped=' + skipped,
            'flaky=' + flaky,
          ];
          if (outputFile) fs.appendFileSync(outputFile, lines.join('\n') + '\n');

          console.log('Summary:', summary);
          "

      - name: Upload test summary JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.json
          retention-days: 14

      # ── Send email report via GitHub Actions email step ────────────────────

      - name: Send test report email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: ParaBank CI <${{ secrets.MAIL_USERNAME }}>
          subject: >
            [ParaBank CI] ${{ steps.playwright.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}
            — ${{ steps.parse.outputs.passed }}/${{ steps.parse.outputs.total }} tests passed
            (Run #${{ github.run_number }})
          html_body: |
            <h2>ParaBank Playwright Test Report</h2>
            <p>
              <strong>Branch:</strong> ${{ github.ref_name }}<br/>
              <strong>Commit:</strong> <code>${{ github.sha }}</code><br/>
              <strong>Triggered by:</strong> ${{ github.actor }}<br/>
              <strong>Run:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View in GitHub Actions</a>
            </p>

            <h3>Test Summary</h3>
            <table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;">
              <tr><th>✅ Passed</th><th>❌ Failed</th><th>⏭ Skipped</th><th>⚠️ Flaky</th><th>Total</th></tr>
              <tr>
                <td align="center">${{ steps.parse.outputs.passed }}</td>
                <td align="center">${{ steps.parse.outputs.failed }}</td>
                <td align="center">${{ steps.parse.outputs.skipped }}</td>
                <td align="center">${{ steps.parse.outputs.flaky }}</td>
                <td align="center">${{ steps.parse.outputs.total }}</td>
              </tr>
            </table>

            <h3>Failed Tests</h3>
            <p>
              Screenshots, traces and videos for failed tests are available as
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                GitHub Actions Artifacts
              </a>
              (test-results artifact — retained for 7 days).
            </p>

            <h3>Flaky Tests</h3>
            <p>Any test that passed only after a retry is flagged below and must be investigated:</p>
            <ul>
              <li>See the <code>test-summary.json</code> artifact for the full flaky test list.</li>
            </ul>

            <hr/>
            <p style="font-size:0.85em;color:#666;">
              Generated by GitHub Actions · ParaBank Playwright CI ·
              Run <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a>
            </p>
          attachments: test-summary.json

      # Fail the job AFTER all post-steps (report, email) have run
      - name: Fail if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
